name: italian_brainrot_app
description: "Italian brainrot gacha & dodge game."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^2.4.0
  cupertino_icons: ^1.0.2
  audioplayers: ^5.2.0
  flutter_riverpod: ^2.4.5
  flame: ^1.18.0
  flame_audio: ^2.1.6
  intl: ^0.19.0
  shared_preferences: ^2.0.6
  animated_text_kit: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/images/characters/
    - assets/images/ui/
    - assets/images/bg/
    - assets/sounds/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
